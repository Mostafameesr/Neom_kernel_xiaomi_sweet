name: "Build Kernel"

env:
  # --- NERV HQ CONFIGURATION ---
  KERNEL_NAME: "FranxxCORE"
  DEVICE: "Sweet"
  CODENAME: "ThriceUponATime"
  DEFCONFIG: "sweet_defconfig"
  CLANG_VER: "r547379"
  
  # --- MAGI SYSTEM IDENTITY ---
  KBUILD_BUILD_USER: "RapliVX"
  KBUILD_BUILD_HOST: "NERV-MAGI-01"
  TZ: "Asia/Jakarta"
  
  # --- SECURITY CLEARANCE ---
  TG_TOKEN: ${{ secrets.TG_TOKEN }}
  TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}

on:
  workflow_dispatch:

jobs:
  # ------------------------------------------------------------------
  # PHASE 1: PARALLEL SYNCHRONIZATION (MATRIX BUILD)
  # ------------------------------------------------------------------
  synchronization:
    name: "🛡️ ${{ matrix.unit }} // LAUNCH"
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- NON-KSU VARIANTS ---
          - unit: "UNIT-00 (AOSP-STD)"
            variant: "AOSP"
            ksu: false
            patch_miui: false
          - unit: "UNIT-01 (MIUI-STD)"
            variant: "MIUI"
            ksu: false
            patch_miui: true
          
          # --- KSU VARIANTS ---
          - unit: "UNIT-02 (AOSP-KSU)"
            variant: "AOSP-KSU"
            ksu: true
            patch_miui: false
          - unit: "UNIT-03 (MIUI-KSU)"
            variant: "MIUI-KSU"
            ksu: true
            patch_miui: true

    steps:
      - name: "⬢ [INIT] :: GEOFRONT_ACCESS"
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: "⬢ [SYSTEM] :: LCL_FILLING"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
          git ccache automake flex lzop bison gperf build-essential zip curl \
          zlib1g-dev g++-multilib libxml2-utils bzip2 libbz2-dev libbz2-1.0 \
          libghc-bzlib-dev squashfs-tools pngcrush schedtool dpkg-dev liblz4-tool \
          make optipng maven libssl-dev pwgen libswitch-perl policycoreutils \
          minicom libxml-simple-perl libxml-sax-base-perl libxml-sax-expat-perl \
          bc libncurses5-dev lib32ncurses5-dev lib32readline-dev lib32z1-dev \
          liblz4-dev libsdl1.2-dev libwxgtk3.0-gtk3-dev libxml2 \
          imagemagick xsltproc python3 python3-pip wget coreutils aria2

      - name: "⚡ [POWER] :: POSITRON_RIFLE_SETUP"
        id: cache-tools
        uses: actions/cache@v4
        with:
          path: |
            aosp-clang
            ~/.ccache
          key: ${{ runner.os }}-magi-clang-${{ env.CLANG_VER }}

      - name: "🔧 [EQUIP] :: UMBILICAL_CABLE"
        if: steps.cache-tools.outputs.cache-hit != 'true'
        run: |
          echo "Initiating High-Speed Synchronization via aria2c..."
          aria2c -x 16 -s 16 -o aosp-clang.tar.gz \
          "https://github.com/topnotchfreaks/clang/releases/download/v1.0.0/clang-r547379.tar.gz"
          mkdir -p aosp-clang
          tar -xf aosp-clang.tar.gz -C aosp-clang
          rm -f aosp-clang.tar.gz

      - name: "🧹 [PURGE] :: KSU_DNA_EXTRACTION"
        if: matrix.ksu == false
        run: |
          echo "Purging KSU configurations from ${{ env.DEFCONFIG }}..."
          sed -i '/CONFIG_KSU/d' arch/arm64/configs/${{ env.DEFCONFIG }}
          echo "✅ Synchronization clean for Non-KSU unit."

      - name: "☢️ [INJECT] :: MAMBOSU_DNA"
        if: matrix.ksu == true
        run: |
          echo "⚠️ INITIATING MAMBOSU PROTOCOL ..."
          rm -rf KernelSU drivers/kernelsu
          curl -LSs "https://raw.githubusercontent.com/Sorayukii/KernelSU-Next/stable/kernel/setup.sh" | bash -s hookless

      - name: "🩹 [PATCH] :: A.T. FIELD_NEUTRALIZATION"
        if: matrix.patch_miui == true
        run: |
          echo "Applying MIUI Optimization Patch..."
          TARGET_FILES=("dsi-panel-k6-38-0c-0a-fhd-dsc-video.dtsi" "dsi-panel-k6-38-0e-0b-fhd-dsc-video.dtsi")
          for TARGET in "${TARGET_FILES[@]}"; do
              FILE_PATH=$(find . -type f -name "$TARGET" | head -n 1)
              if [ -n "$FILE_PATH" ]; then
                  sed -i 's/qcom,mdss-pan-physical-width-dimension = <69>;/qcom,mdss-pan-physical-width-dimension = <695>;/g' "$FILE_PATH"
                  sed -i 's/qcom,mdss-pan-physical-height-dimension = <154>;/qcom,mdss-pan-physical-height-dimension = <1546>;/g' "$FILE_PATH"
              fi
          done

      - name: "⚔️ [LAUNCH] :: SYNCHRONIZATION_START"
        run: |
          export PATH="${{ github.workspace }}/aosp-clang/bin:$PATH"
          mkdir -p out
          make O=out ARCH=arm64 ${DEFCONFIG}
          make -j$(nproc --all) O=out ARCH=arm64 \
            LLVM=1 LLVM_IAS=1 CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            Image.gz dtbo.img dtb.img

      - name: "📤 [DATA] :: ENTRY_PLUG_EJECTION"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.variant }}-unit
          path: |
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/dtb.img
            out/arch/arm64/boot/dtbo.img
          retention-days: 1

  # ------------------------------------------------------------------
  # PHASE 2: HUMAN INSTRUMENTALITY (DEPLOYMENT)
  # ------------------------------------------------------------------
  human-instrumentality:
    name: "🧬 PROTOCOL: FINAL_DOGMA"
    runs-on: ubuntu-latest
    needs: [synchronization]
    permissions:
      contents: write

    steps:
      - name: "📥 [DATA] :: ARTIFACT_COLLECTION"
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: "📦 [SEAL] :: BAKELITE_ENCASING"
        run: |
          mkdir -p release_zips
          git clone -q https://github.com/RapliVx/AnyKernel3.git -b sweet AnyKernel3
          
          # NERV BANNER (Heredoc fix)
          cat << 'EOF' > AnyKernel3/banner

          NERV TACTICAL OPERATION
          -----------------------
          PROJECT: ProjectEVA
          MODEL  : Redmi Note 10 Pro
          PILOT  : RapliVX
          
          [ STATUS: STABLE ]
          EOF

          for DIR in ./artifacts/*-unit; do
              VARIANT=$(basename "$DIR" -unit)
              echo "Processing $VARIANT..."
              
              cp -f $DIR/Image.gz AnyKernel3/
              cp -f $DIR/dtb.img AnyKernel3/
              cp -f $DIR/dtbo.img AnyKernel3/
              
              ZIP_NAME="${KERNEL_NAME}-${VARIANT}-${CODENAME}-$(date +'%Y%m%d').zip"
              cd AnyKernel3
              zip -r9 "../release_zips/$ZIP_NAME" * -x .git README.md
              cd ..
          done

      - name: "⬆️ [EXPORT] :: GEOFRONT_RELEASE"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "EVA-${{ github.run_number }}"
          name: "ProjectEVA: MAMBOSU [Run ${{ github.run_number }}]"
          files: release_zips/*.zip
          body: |
            ### ⚠️ NERV SECURITY CLEARANCE REQUIRED
            **Mission:** Kernel Instrumentality
            **Device:** Redmi Note 10 Pro (sweet)
            
            #### 📦 DEPLOYED UNITS:
            - **AOSP**: Standard Edition
            - **MIUI**: Patched for Stock MIUI
            - **AOSP-KSU**: MamboSU Integrated
            - **MIUI-KSU**: MamboSU + MIUI Patch
            
            *Synchronization Ratio: 400%*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "📡 [NOTIFY] :: MAGI_BROADCAST"
        if: success()
        run: |
          MSG="<b>🚨 MAGI SYSTEM // MISSION COMPLETE 🚨</b>%0A%0A"
          MSG+="<b>TARGET:</b> ProjectEVA MAMBOSU%0A"
          MSG+="<b>UNITS:</b> 4 Variants Deployed (Clean/KSU)%0A"
          MSG+="🔗 <a href='https://github.com/${{ github.repository }}/releases/tag/EVA-${{ github.run_number }}'>ACCESS DATA TERMINAL</a>"
          curl -s -X POST "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
            -d chat_id="$TG_CHAT_ID" \
            -d text="$MSG" \
            -d parse_mode="HTML" \
            -d disable_web_page_preview=true
name: "FS Auto Importer"

on:
  workflow_dispatch:

jobs:
  import-files:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: "Checkout Repo"
        uses: actions/checkout@v4

      - name: "Download & Inject fs folders"
        run: |
          echo "Cloning crDroid fs components..."
          git clone --depth 1 -b 16.0 https://github.com/crdroidandroid/android_kernel_xiaomi_sm6150.git /tmp/crdroid
          
          echo "Removing old f2fs..."
          rm -rf fs/f2fs
          
          echo "Copying new f2fs and erofs..."
          cp -r /tmp/crdroid/fs/f2fs fs/
          cp -r /tmp/crdroid/fs/erofs fs/
          
          echo "Updating Kconfig..."
          if ! grep -q 'source "fs/erofs/Kconfig"' fs/Kconfig; then
            echo 'source "fs/erofs/Kconfig"' >> fs/Kconfig
          fi
          
          echo "Updating Makefile..."
          if ! grep -q 'obj-$(CONFIG_EROFS_FS) += erofs/' fs/Makefile; then
            echo 'obj-$(CONFIG_EROFS_FS) += erofs/' >> fs/Makefile
          fi

      - name: "Commit and Push changes"
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add fs/
          git commit -m "fs: import EROFS and update F2FS from crDroid 16.0" || echo "No changes to commit"
          git push
